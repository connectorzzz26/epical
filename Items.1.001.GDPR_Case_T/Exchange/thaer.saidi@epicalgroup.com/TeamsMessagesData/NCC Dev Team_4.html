body {
  background-color: #E9E9E9;
}
@media (min-width: 480px) {
  body {
    padding: 20px;
  }
}

.reply-line-container {
  position: relative;
  z-index: 1;
}

@media (min-width: 480px) {
  .reply-line-container:before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 10px;
    width: 1px;
    background-color: #C8C8C8;
  }
}

.message {
  position: relative;
  z-index: 2;
  font-family: "Segoe UI", sans-serif;
  padding: 16px 16px 12px 16px;
  border-radius: 3px;
}

.message--chat {
  margin-bottom: 32px;
}

.message--chat--edit {
  margin-bottom: 6px;
}

.message--channel {
  background-color: white;
  margin-bottom: 6px;
}

.message--author {
  background-color: #E2E2F6;
}

.message--responder {
  background-color: white;
}

hr {width: auto; margin-top: 0px; margin-bottom: 0px; margin-left: 0px;margin-right: auto;height: 1px; color:#E9E9E9;background-color:#E9E9E9;opacity:0 }

blockquote {
    font-size: 1.4rem;
    background-color: #f5f5f5;
    color: #424242;
    margin: .7rem 0;
    padding: .7rem 1.6rem .7rem 1.1rem;
    border-left: .4rem solid #d1d1d1;
}

.pre, code, pre {
    padding: 0.5rem;
    background: #e1dfdd;
    border-radius: 0.2rem;
}

.message--reply-level-1 {
  margin-left: 24px;
}
@media (min-width: 480px) {
  .message--reply-level-1 {
    margin-left: 48px;
  }
}

.message--reply-level-2 {
  margin-left: 96px;
}

.message__header {
  display: inline-block;
  flex-wrap: wrap;
  align-items: center;
  margin: 0;
  padding: 0;
  line-height: 1;
}

.message__announcementtitle {
	font-family: "Segoe UI", sans-serif;
	font-size: 16px;
	font-weight: 900;
	background: #cddaea;
	color: #164279;
	white-space: nowrap;
    padding: 20;
}

.message__subhead {
	font-family: "Segoe UI", sans-serif;
	font-size: 14px;
	font-weight: 800;
	white-space: nowrap;
	padding: 20;
}

.message__author {
  margin-right: 8px;
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #323130;
  white-space: nowrap;
}

.message__recepient {
  margin-right: 8px;
  font-family: "Segoe UI", sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #787878;
  white-space: nowrap;
}

.message__date-item-wrapper {
  display: inline-block;
  white-space: nowrap;
}

.message__date {
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #323130;
  margin-right: 6px;
  white-space: nowrap;
  line-height: 1;
}

.message__time {
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #323130;
  margin-right: 8px;
  white-space: nowrap;
  line-height: 1;
}

.message__content {
  font-size: 16px;
  line-height: 1.3;
  margin-bottom: 2px;
  color: #323130;
}

.message__image {
  max-height: 400px;
}

.message__content-paragraph {
  margin: 0 0 6px 0;
  color: #323130;
  word-break:break-word;
}

.message__align_right {
  text-align: right;
}

a {
  word-break: break-word;
}

.message__content-info-msg {
  font-style: italic;
}

.message__content-link {
  font-family: "Segoe UI", sans-serif;
  font-size: 16px;
  color: #484644;
  word-break: break-word;
}

.message__edits {
  margin-top: 14px;
}

.reaction {
  display: inline-block;
  flex-wrap: wrap;
  line-height: 1.5;
  color: #656565;
  font-family: "Segoe UI", sans-serif;
  font-style: italic;
  font-size: 10px;
  white-space: nowrap;
}

.reaction__icon {

<script>
  window.addEventListener("DOMContentLoaded", function() {
    console.log("[MessageSorter] Starting sort...");

    const messageSelector = '.message';
    const allMessages = document.querySelectorAll(messageSelector);
    
    if (allMessages.length === 0) return;

    const container = allMessages[0].parentNode;
    const messagesArray = Array.from(allMessages);

    function getTimestamp(messageDiv) {
      const dateEl = messageDiv.querySelector('.message__date-item-wrapper .message__date');
      const timeEl = messageDiv.querySelector('.message__date-item-wrapper .message__time');

      if (!dateEl || !timeEl) return 0;

      const fullDateString = `${dateEl.textContent.trim()} ${timeEl.textContent.trim()}`;
      const timestamp = new Date(fullDateString).getTime();

      return isNaN(timestamp) ? 0 : timestamp;
    }

    messagesArray.sort((a, b) => {
      return getTimestamp(a) - getTimestamp(b);
    });

    messagesArray.forEach(message => {
      container.appendChild(message);
    });

    console.log("[MessageSorter] Sort complete.");
  });
</script>
